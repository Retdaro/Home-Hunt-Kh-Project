<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Visit</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <header class="hero">
        <p>BOOK A VISIT</p>
        <h1>Reserve Your Stay</h1>
    </header>

    <main id="book">

        <div class="left-side">
            <div class="room-card">
                <img src="/Img/Warm Luxury Hotel Lobby Reception.png" alt="Deluxe Room">
                <h2>Deluxe Room</h2>
                <p>1 Bed</p>
                <hr>
                <p class="total-price">Total Price</p>
                <h1>$300 <span>/ Month</span></h1>
                <p>Including taxes & fees</p>
            </div>

            <div class="contact">
                <h3>Other ways to contact us</h3>

            </div>
        </div>

        <div class="form-card">
            <h2>Guest Information</h2>
            <p>Please provide your details so we can confirm your booking.</p>

            <form>
                <div class="input-row">
                    <div>
                        <label>Full Name *</label>
                        <input type="text" placeholder="Enter your full name">
                    </div>

                    <div>
                        <label>Phone Number *</label>
                        <input type="tel" placeholder="+855 71 972 784">
                    </div>
                </div>

                <label>Email Address *</label>
                <input type="email" placeholder="Johnsmith123@gmail.com">

                <label>Send a message *</label>
                <textarea placeholder="Any request"></textarea>
                <hr>

                <button type="submit">Book a visit</button>
            </form>
        </div>

    </main>
    
</body>
</html>
