<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Hunt KH </title>
  
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #fdfbf7;
    }

    /* ah nis header */
    header {
      background-color: #5A3615; 
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    /* ah nis logo */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px; 
    }

    .logo-img {
      height: 50px; 
      width: auto;  
    }

    nav {
      display: flex;                     /* under line nv nav*/
      gap: 30px; 
    }
    nav a {
      color: #f3e8df;
      text-decoration: none;
      font-size: 18px;
      padding-bottom: 5px;
      position: relative;
      margin-left: 35px;
    }
    nav a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px; 
      bottom: 0;
      left: 0;
      background-color: #d4a373; 
      transition: width 0.3s ease;
    }
    nav a:hover::after {
      width: 100%;
    }
    nav a.active::after {
      width: 100%;
    }
     /* Laptop */
.container {
    display: flex;
    gap: 20px;
}
    
    @media (max-width: 700px) {
    .container {
        flex-direction: column;
    }

    .menu {
        flex-direction: column;
    }

    img {
        width: 100%;
    }
}


  </style>
</head>
<body>

  <header>
        <div class="logo-container">
            <img src="/Img/logo-white.png" alt="Home Hunt KH Logo" class="logo-img">
            
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Listings</a>
            <a href="#">Book a Visits</a>
        </nav>
  </header>



  

</body>
</html>
