<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
               /* Jol dol hero section*/
    .hero {
      width: 100%;   
      height: 500px;
      background-image: url(/Img/bg.png); 
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      padding-left: 60px;
    }

    .hero-content {
      max-width: 400px;
    }

    .subtitle {
      font-size: 12px;
      font-weight: bold;
      color: #665b53;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      color: #4a2c17;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .text {
      font-size: 14px;
      color: #554a43;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background-color: #5A3615;
      color: white;
      padding: 12px 26px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }

    .button:hover {
      background-color: #3b2617;
    }

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

    </style>
</head>

<body>
    
                     <!-- Jol dol hero section-->
  <section class="hero">
    <div class="hero-content">
      <p class="subtitle">WELCOME TO HOME HUNT KH</p>
      <h1 class="title">Your Perfect Stay<br>Awaits</h1>
      <p class="text">
        Experience luxury, comfort, and breathtaking views in the heart of the city. Book your stay today and make unforgettable memories.
      </p>
      <a href="#" class="button">Explore listings</a>
    </div>
  </section>

</body>
</html>
