<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* Base Footer Styling */
.site-footer {
  width: 100%;
  background-image: url(/Img/footer-bg.png);
  padding: 50px 20px 40px;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
}

.footer-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 30px;
}

.footer-col {
  flex: 1;
  min-width: 200px;
}

/* Logo & Brand Column */
.brand-col {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.footer-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

.logo-text {
  font-size: 24px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: 0.5px;
}

.copyright {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 50px;
}

/* Headings */
.footer-heading {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #ffffff;
}

/* Quick Links */
.footer-links {
  list-style: none;
  padding: 0;
  margin: 0;
}

.footer-links li {
  margin-bottom: 12px;
}

.footer-links a {
  color: rgba(255, 255, 255, 0.85);
  text-decoration: none;
  font-size: 16px;
  transition: color 0.2s ease;
}

.footer-links a:hover {
  color: #ffffff;
}

/* Contact Info */
.contact-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.contact-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.85);
  line-height: 1.4;
}

.contact-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  margin-top: 2px;
}

/* Social Media Icons */
.social-links {
  display: flex;
  gap: 12px;
}

.social-links a {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  text-decoration: none;
  font-size: 14px;
  transition: all 0.2s ease;
}

.social-links a:hover {
  background-color: #ffffff;
  color: #30160a;
}
  </style>
</head>
<body>
  
  <footer class="site-footer">
  <div class="footer-container">
    
    <!-- Brand / Logo Section -->
    <div class="footer-col brand-col">
      <div class="footer-logo">
        <img src="logo-icon.png" alt="Home Hunt KH Logo" class="logo-img">
        <span class="logo-text">Home Hunt KH</span>
      </div>
      <p class="copyright">@ 2026 home hunt kh.com All right served</p>
    </div>

    <!-- Quick Links -->
    <div class="footer-col">
      <h4 class="footer-heading">Quick link</h4>
      <ul class="footer-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Listing</a></li>
        <li><a href="#">Property Detail</a></li>
        <li><a href="#">Book visit</a></li>
      </ul>
    </div>

    <!-- Contact Info -->
    <div class="footer-col">
      <h4 class="footer-heading">Contact Us</h4>
      <ul class="contact-list">
        <li>
          <img src="phone-icon.svg" alt="Phone" class="contact-icon">
          <span>012 345 678</span>
        </li>
        <li>
          <img src="mail-icon.svg" alt="Email" class="contact-icon">
          <span>hello@homehuntkh.example</span>
        </li>
        <li>
          <img src="location-icon.svg" alt="Location" class="contact-icon">
          <span>Street 315, Boeung Kak 2,<br>Toul Kork, Phnom Penh</span>
        </li>
      </ul>
    </div>

    <!-- Follow Us / Social Links -->
    <div class="footer-col">
      <h4 class="footer-heading">Follow Us</h4>
      <div class="social-links">
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="#" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
      </div>
    </div>

  </div>
</footer>

<!-- Include FontAwesome for Social Icons (optional) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
