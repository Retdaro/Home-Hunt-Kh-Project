<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4eee8;
      padding: 40px;
    }

    /* Target by ID */
    #main-footer {
      position: relative;
      background-color: #43210d;
      color: #ffffff;
      padding: 50px 60px 40px;
      overflow: hidden;
      border-radius: 4px;
    }

    #main-footer::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 45%;
      background: url(/Img/footerbg.jpg);
        background-size: cover;
      pointer-events: none;
    }

    .footer-container {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1.5fr 1fr;
      gap: 40px;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
    }

    #brand-logo i {
      font-size: 32px;
    }

    #copyright-text {
      font-size: 13px;
      color: #d1c7bd;
      margin-top: 60px;
    }

    .footer-column h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffffff;
    }

    /* Links & Lists */
    .quick-links ul, .contact-info ul {
      list-style: none;
    }

    .quick-links li {
      margin-bottom: 12px;
    }

    .quick-links a {
      color: #d1c7bd;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.2s;
    }

    .quick-links a:hover {
      color: #ffffff;
    }

    .contact-info li {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
      color: #d1c7bd;
      font-size: 14px;
      line-height: 1.4;
    }

    .contact-info i {
      font-size: 18px;
      color: #ffffff;
      margin-top: 2px;
    }

    .social-links {
      display: flex;
      gap: 12px;
    }

    .social-icon {
      width: 32px;
      height: 32px;
      border: 1px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }

    .social-icon:hover {
      background-color: #ffffff;
      color: #43210d;
    }

    @media (max-width: 900px) {
      .footer-container {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .footer-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ID added to main footer element -->
  <footer id="main-footer">
    <div class="footer-container">
      
      <!-- Brand & Copyright -->
      <div id="footer-brand" class="footer-brand">
        <a href="#" id="brand-logo">
          <i class="fa-solid fa-house"></i>
          <span>Home Hunt KH</span>
        </a>
        <p id="copyright-text">@ 2026 home hunt kh.com All right served</p>
      </div>

      <!-- Quick Links Column -->
      <div id="quick-links-section" class="footer-column quick-links">
        <h3>Quick link</h3>
        <ul>
          <li><a id="link-home" href="#home">Home</a></li>
          <li><a id="link-listing" href="#listing">Listing</a></li>
          <li><a id="link-property-detail" href="#property-detail">Property Detail</a></li>
          <li><a id="link-book-visit" href="#book-visit">Book visit</a></li>
        </ul>
      </div>

      <!-- Contact Us Column -->
      <div id="contact-us-section" class="footer-column contact-info">
        <h3>Contact Us</h3>
        <ul>
          <li id="contact-phone">
            <i class="fa-solid fa-phone"></i>
            <span>012 345 678</span>
          </li>
          <li id="contact-email">
            <i class="fa-solid fa-envelope"></i>
            <span>hello@homehuntkh.example</span>
          </li>
          <li id="contact-address">
            <i class="fa-solid fa-location-dot"></i>
            <span>Street 315, Boeung Kak 2,<br>Toul Kork, Phnom Penh</span>
          </li>
        </ul>
      </div>

      <!-- Follow Us Column -->
      <div id="follow-us-section" class="footer-column">
        <h3>Follow Us</h3>
        <div id="social-media-links" class="social-links">
          <a id="social-facebook" href="#" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
          <a id="social-instagram" href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
          <a id="social-youtube" href="#" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
          <a id="social-x" href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
      </div>

    </div>
  </footer>

</body>
</html>
